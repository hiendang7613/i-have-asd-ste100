<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Before and after i-have-asd-ste100</title>
<desc id="desc">Left: a default agent reply as one long paragraph. Right: the same facts as short key-first bullets, then a five-line conclusion block with icons.</desc>
<style>
.m { font: 15.5px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
.t { font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.h { font: 700 20px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
</style>
<rect width="1200" height="470" rx="20" fill="#0B1020"/>
<text x="320" y="48" text-anchor="middle" class="h" fill="#9CA3AF">Default agent: 166 words</text>
<text x="880" y="48" text-anchor="middle" class="h" fill="#C7D2FE">With i-have-asd-ste100: same facts, scannable</text>
<g transform="translate(40,70)">
<rect width="560" height="370" rx="14" fill="#111827" stroke="#374151" stroke-opacity="0.55" stroke-width="2"/>
<circle cx="24" cy="22" r="6" fill="#F87171"/><circle cx="44" cy="22" r="6" fill="#FBBF24"/><circle cx="64" cy="22" r="6" fill="#34D399"/>
<text x="280" y="27" text-anchor="middle" class="t" fill="#6B7280">claude</text>
<text x="22" y="66" class="m"><tspan fill="#9CA3AF">Great question! I looked into the failing login</tspan></text>
<text x="22" y="92" class="m"><tspan fill="#9CA3AF">test, and it turns out the problem was in how the</tspan></text>
<text x="22" y="118" class="m"><tspan fill="#9CA3AF">token verification function in the auth module</tspan></text>
<text x="22" y="144" class="m"><tspan fill="#9CA3AF">read the token: verifyToken was reading a custom</tspan></text>
<text x="22" y="170" class="m"><tspan fill="#9CA3AF">header, while the new client sends the standard</tspan></text>
<text x="22" y="196" class="m"><tspan fill="#9CA3AF">Authorization header, so its requests were</tspan></text>
<text x="22" y="222" class="m"><tspan fill="#9CA3AF">rejected with a 401. I updated verifyToken and</tspan></text>
<text x="22" y="248" class="m"><tspan fill="#9CA3AF">ran npm test again, and 213 of the 214 tests pass</tspan></text>
<text x="22" y="274" class="m"><tspan fill="#9CA3AF">now. The one that still fails is payment.spec.ts:88,</tspan></text>
<text x="22" y="300" class="m"><tspan fill="#9CA3AF">but I didn't touch payment code, so it is probably</tspan></text>
<text x="22" y="326" class="m"><tspan fill="#9CA3AF">unrelated. Production is ready whenever you approve.</tspan></text>
<text x="22" y="352" class="m"><tspan fill="#9CA3AF">By the way, jsonwebtoken is old... Hope this helps!</tspan></text>
</g>
<g transform="translate(600,70)">
<rect width="560" height="370" rx="14" fill="#111827" stroke="#6366F1" stroke-opacity="0.55" stroke-width="2"/>
<circle cx="24" cy="22" r="6" fill="#F87171"/><circle cx="44" cy="22" r="6" fill="#FBBF24"/><circle cx="64" cy="22" r="6" fill="#34D399"/>
<text x="280" y="27" text-anchor="middle" class="t" fill="#6B7280">claude  ·  i-have-asd-ste100</text>
<text x="22" y="66" class="m"><tspan fill="#9CA3AF">- </tspan><tspan fill="#E5E7EB" font-weight="700">Cause:</tspan><tspan fill="#9CA3AF"> </tspan><tspan fill="#7DD3FC">verifyToken</tspan><tspan fill="#E5E7EB"> read a custom header.</tspan></text>
<text x="22" y="92" class="m"><tspan fill="#9CA3AF">- </tspan><tspan fill="#E5E7EB" font-weight="700">Fix:</tspan><tspan fill="#E5E7EB"> it now reads </tspan><tspan fill="#7DD3FC">Authorization</tspan><tspan fill="#E5E7EB">.</tspan></text>
<text x="22" y="118" class="m"><tspan fill="#9CA3AF">- ✅ </tspan><tspan fill="#E5E7EB" font-weight="700">Tests:</tspan><tspan fill="#E5E7EB"> 214 ran, 213 pass.</tspan></text>
<text x="22" y="144" class="m"><tspan fill="#9CA3AF">- ❌ </tspan><tspan fill="#7DD3FC">payment.spec.ts:88</tspan><tspan fill="#FCA5A5"> fails; cause not checked.</tspan></text>
<text x="22" y="182" class="m"><tspan fill="#9CA3AF">- 🎯 </tspan><tspan fill="#A5B4FC" font-weight="700">Conclusion:</tspan><tspan fill="#E5E7EB"> Login fixed; 1 payment test fails.</tspan></text>
<text x="22" y="208" class="m"><tspan fill="#9CA3AF">- 🔑 </tspan><tspan fill="#A5B4FC" font-weight="700">Approve:</tspan><tspan fill="#86EFAC"> Deploy the fix to production.</tspan></text>
<text x="22" y="234" class="m"><tspan fill="#9CA3AF">- 👉 </tspan><tspan fill="#A5B4FC" font-weight="700">Your action:</tspan><tspan fill="#6B7280"> None.</tspan></text>
<text x="22" y="260" class="m"><tspan fill="#9CA3AF">- ❓ </tspan><tspan fill="#A5B4FC" font-weight="700">Question:</tspan><tspan fill="#E5E7EB"> Check the payment test first?</tspan></text>
<text x="22" y="286" class="m"><tspan fill="#9CA3AF">- 📌 </tspan><tspan fill="#A5B4FC" font-weight="700">Open:</tspan><tspan fill="#E5E7EB"> Update jsonwebtoken 8.5.1 (me).</tspan></text>
</g>
<text x="600" y="458" text-anchor="middle" class="t" fill="#4B5563">Illustration: a hand-written sample of the reply shape, not model output.</text>
</svg>
