name: Bug or bad reply
description: The plugin did not load, a hook failed, or a reply broke the rules.
labels: ["bug"]
body:
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      placeholder: "Claude Code 2.1.x / Codex 0.x"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reply
    attributes:
      label: The reply (or the hook output), with private data removed
      render: markdown
  - type: textarea
    id: check
    attributes:
      label: Output of python3 scripts/check_reply.py on that reply (optional)
      render: text
